<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aplikasi TKA</title>
<style>
:root{--blue:#2f6496;--blue2:#3f78b5;--btn:#007bff;--next:#0069d9;--red:#dc3545;--green:#28a745;--yel:#ffc107;--bg:#fdfdfd;--card:#fff;--tx:#212529;--mu:#5b6670;--ln:#e6e8eb;--band:#e9eef4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232a;--tx:#e8ecf0;--mu:#9aa6b2;--ln:#323a43;--band:#232b34;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh}
.band{position:absolute;inset:0 0 auto;height:230px;background:linear-gradient(120deg,var(--blue2),var(--blue) 55%,#2a5985);z-index:0}
.top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;max-width:960px;margin:0 auto;padding:18px 20px;color:#fff}
.top b{font-size:20px;display:block}.top small{opacity:.9;letter-spacing:.04em}
.user{display:flex;gap:10px;align-items:center}.user i{background:#7fb0f0;border-radius:6px;padding:4px 8px;font-style:normal}
.card{position:relative;z-index:1;background:var(--card);max-width:560px;margin:22px auto;border-radius:14px;padding:36px 40px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.wrap{position:relative;z-index:1;max-width:960px;margin:18px auto;padding:0 16px}
h1{font-size:30px;font-weight:400;margin:0 0 14px}h2{font-size:20px;margin:0 0 8px}
label{display:block;font-size:13px;font-weight:700;margin-top:14px}
.fld{width:100%;border:0;border-bottom:2px solid var(--ln);background:transparent;color:var(--tx);font:inherit;font-size:19px;padding:6px 2px;outline:0}
.fld:focus{border-color:var(--btn)}
select.fld{cursor:pointer}
.btn{border:0;border-radius:999px;padding:12px 22px;font:inherit;font-weight:600;color:#fff;background:var(--btn);cursor:pointer}
.btn.full{width:100%;margin-top:22px}.btn:focus-visible,.fld:focus-visible,.opt:focus-visible{outline:3px solid #8ec5ff;outline-offset:2px}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.yel{background:var(--yel);color:#222}.btn.next{background:var(--next)}.btn.gr{background:#6c757d}.btn.sm{padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.eye{position:absolute;right:4px;bottom:8px;background:none;border:0;cursor:pointer;color:var(--mu);font-size:13px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ex{display:flex;flex-direction:column;min-height:100vh}
.exh{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 24px;border-bottom:1px solid var(--ln);gap:12px;flex-wrap:wrap}
.exh .n{font-size:22px}.fs a{cursor:pointer;margin-right:8px;color:var(--tx);border:0;background:none;font-family:inherit}
.pill{border-radius:999px;border:1px solid var(--ln);padding:5px 14px;font-size:13px;color:var(--mu);background:var(--card)}
.pill.b{background:var(--btn);color:#fff;border:0;cursor:pointer}
.body{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;margin:14px 24px;border:1px solid var(--ln);background:var(--card)}
.body>div{padding:22px 28px;font-family:"Times New Roman",Times,serif}
.body>div:first-child{border-right:2px dotted var(--ln)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:9px 4px;cursor:pointer;border-radius:8px}
.opt:hover{background:var(--band)}.opt .r{flex:none;width:20px;height:20px;border:2px solid #9aa6b2;border-radius:50%;margin-top:3px}
.opt.on .r{border-color:var(--btn);background:radial-gradient(var(--btn) 45%,transparent 50%)}
.foot{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 26px;gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal .card{margin:0;max-width:520px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:12px}
.g{padding:10px 0;text-align:center;border-radius:8px;border:1px solid var(--ln);cursor:pointer;background:var(--card);color:var(--tx);font:inherit}
.g.a{background:var(--btn);color:#fff;border-color:var(--btn)}.g.q{background:var(--yel);color:#222;border-color:var(--yel)}.g.c{outline:3px solid var(--tx)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:0;background:var(--band);color:var(--tx);padding:9px 16px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff}
.panel{background:var(--card);border-radius:12px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);vertical-align:top}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;color:#fff}.t0{background:#6c757d}.t1{background:var(--btn)}.t2{background:var(--green)}.t3{background:#17a2b8}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.f2 .fld{font-size:16px;border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
textarea.fld{resize:vertical;min-height:60px}
.q{border:1px solid var(--ln);border-radius:10px;padding:12px;margin-top:10px}
.muted{color:var(--mu);font-size:14px}
.sync-bar{position:fixed;bottom:12px;right:16px;background:var(--card);border:1px solid var(--ln);padding:6px 14px;border-radius:999px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:20;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.dot.busy{background:var(--yel);animation:pulse 1s infinite}
.dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
@media(max-width:760px){.body{grid-template-columns:1fr;margin:10px}.body>div:first-child{border-right:0;border-bottom:2px dotted var(--ln)}.card{margin:16px 12px;padding:26px 22px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="sync-bar" id="syncStatus"><span class="dot" id="syncDot"></span><span id="syncText">Menghubungkan ke server...</span></div>

<script>
(function(){
var API_URL = "https://script.google.com/macros/s/AKfycbxgDAvgp8JW1GnzuxQfCdWRcJ048yg81y5FR8sIPHydKO8Eqozx7vvNohMV72BElIR73Q/exec";
var K="tka_v1",app=document.getElementById("app"),E={};

/* ---------- FUNGSI FULLSCREEN ---------- */
function enterFullscreen() {
  var el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
    if (el.requestFullscreen) {
      el.requestFullscreen().catch(function(){});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) {
      el.msRequestFullscreen();
    }
  }
}

function exitFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
    if (document.exitFullscreen) {
      document.exitFullscreen().catch(function(){});
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else if (document.msExitFullscreen) {
      document.msExitFullscreen();
    }
  }
}

// Memicu fullscreen otomatis pada sentuhan/klik pertama siswa jika bukan di halaman admin
document.addEventListener("pointerdown", function(){
  if (!E.adm && E.v !== "admin") {
    enterFullscreen();
  }
});

// Pantau jika siswa keluar dari mode fullscreen saat ujian berlangsung
function handleFsChange() {
  var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
  var oldWarn = document.getElementById("fsWarnModal");
  if (!isFs && E.v === "exam") {
    if (!oldWarn) {
      var d = document.createElement("div");
      d.id = "fsWarnModal";
      d.className = "modal";
      d.innerHTML = '<div class="card" style="text-align:center"><h2>⚠️ Mode Layar Penuh Terhenti</h2><p>Selama ujian berlangsung, layar harus tetap dalam mode <b>Layar Penuh (Fullscreen)</b>.</p><button class="btn full" id="reFs">Kembali ke Layar Penuh</button></div>';
      document.body.appendChild(d);
      d.querySelector("#reFs").onclick = function() {
        enterFullscreen();
        d.remove();
      };
    }
  } else if (isFs && oldWarn) {
    oldWarn.remove();
  }
}
document.addEventListener("fullscreenchange", handleFsChange);
document.addEventListener("webkitfullscreenchange", handleFsChange);

function setSync(state, msg){
  var dot = document.getElementById("syncDot");
  var txt = document.getElementById("syncText");
  if(!dot || !txt) return;
  dot.className = "dot " + (state || "");
  txt.textContent = msg;
}

function e(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function seed(){return{npsn:"12345678",time:{"Matematika":30,"Bahasa Indonesia":30},
students:[{nisn:"0012345678",nama:"Contoh Siswa"}],lg:{},res:{},
qs:[{id:1,mapel:"Matematika",lv:"Sedang",stim:"Sebuah persegi panjang memiliki panjang 12 cm dan lebar 5 cm.",q:"Berapa keliling persegi panjang tersebut?",opts:["17 cm","30 cm","34 cm","60 cm","120 cm"],ans:2},
{id:2,mapel:"Matematika",lv:"Mudah",stim:"",q:"Hasil dari 15 × 4 − 10 adalah ...",opts:["40","50","60","70","80"],ans:1},
{id:3,mapel:"Bahasa Indonesia",lv:"Mudah",stim:"Hujan turun deras sejak pagi sehingga jalan di depan sekolah tergenang.",q:"Kalimat tersebut menyatakan hubungan ...",opts:["pertentangan","syarat","sebab-akibat","tujuan","perbandingan"],ans:2},
{id:4,mapel:"Bahasa Indonesia",lv:"Sedang",stim:"",q:"Antonim kata “rajin” adalah ...",opts:["tekun","malas","giat","ulet","cekatan"],ans:1}]}}

var S;try{S=JSON.parse(localStorage.getItem(K))}catch(x){}S=S||seed();
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}}
function reload(){try{var d=JSON.parse(localStorage.getItem(K));if(d)S=d}catch(x){}}

/* ---------- SINKRONISASI GOOGLE SHEETS ---------- */
async function pullFromServer(silent){
  if(!silent) setSync("busy", "Mengambil data dari Google Sheets...");
  try {
    var resp = await fetch(API_URL);
    var data = await resp.json();
    if(data && data.qs){
      S.npsn = data.npsn || S.npsn;
      S.time = data.time || S.time;
      S.students = data.students || S.students;
      S.qs = data.qs || S.qs;
      S.lg = Object.assign({}, S.lg, data.lg || {});
      S.res = Object.assign({}, S.res, data.res || {});
      save();
      setSync("", "Terhubung ke Google Sheets");
      return true;
    }
  } catch(err) {
    setSync("err", "Mode Offline (Cache Lokal)");
  }
  return false;
}

async function pushToServer(payload){
  setSync("busy", "Menyimpan ke Google Sheets...");
  try {
    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    });
    setSync("", "Tersimpan ke Google Sheets");
  } catch(err) {
    setSync("err", "Gagal kirim ke server");
  }
}

function mapels(){var m=[];S.qs.forEach(function(q){if(m.indexOf(q.mapel)<0)m.push(q.mapel)});return m}
function qsOf(m){return S.qs.filter(function(q){return q.mapel===m})}
function key(n,m){return n+"|"+m}
function pad(n){return n<10?"0"+n:""+n}
function fmtNow(){var d=new Date();return pad(d.getMonth()+1)+"/"+pad(d.getDate())+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())}
function head(user){return '<div class="band"></div><div class="top"><div><b>TKA</b><small>Tes Kemampuan Akademik</small></div>'+(user?'<div class="user"><span>'+e(user)+'</span><i>🎓</i></div>':'')+'</div>'}
function go(v){E.v=v;render()}

/* ---------- LOGIN ---------- */
function vLogin(){
app.innerHTML=head()+'<div class="card" style="margin-top:80px"><h2>Selamat Datang</h2><p class="muted">Silakan login dengan menggunakan username dan password yang anda miliki</p>'+
'<label>Username (NISN)</label><input class="fld" id="u" autocomplete="username" inputmode="numeric"><label>Password (NPSN sekolah)</label><div style="position:relative"><input class="fld" id="p" type="password" autocomplete="current-password"><button class="eye" id="eye" type="button">Lihat</button></div>'+
'<div class="err" id="er"></div><button class="btn full" id="go">Login</button><p class="muted" style="margin-top:18px;text-align:center"><a href="#" id="adm" style="color:var(--blue)">Masuk sebagai admin</a></p></div>';
var u=document.getElementById("u"),p=document.getElementById("p");
document.getElementById("eye").onclick=function(){p.type=p.type==="password"?"text":"password";this.textContent=p.type==="password"?"Lihat":"Sembunyikan"};
async function doLogin(){
  var er=document.getElementById("er");
  var btn=document.getElementById("go");
  
  // Cek Admin langsung tanpa perlu tunggu server
  if(u.value.trim().toLowerCase()==="admin" && p.value.trim().toLowerCase()==="admin"){
    exitFullscreen();
    E.adm=1;E.tab="soal";return go("admin");
  }

  enterFullscreen();
  btn.disabled=true; er.style.color="var(--mu)"; er.textContent="Memeriksa data ke server...";
  await pullFromServer(true);
  reload();
  var s=S.students.filter(function(x){return String(x.nisn)===u.value.trim()})[0];
  if(!s||p.value.trim()!==String(S.npsn)){
    btn.disabled=false; er.style.color="var(--red)";
    er.textContent="NISN atau NPSN salah. Periksa kembali data Anda.";
    return;
  }
  E.s=s;S.lg[s.nisn]=Date.now();save();
  pushToServer({action:"login", nisn:s.nisn});
  go("confirm");
}
document.getElementById("go").onclick=doLogin;p.onkeydown=u.onkeydown=function(ev){if(ev.key==="Enter")doLogin()};
document.getElementById("adm").onclick=function(ev){ev.preventDefault();u.value="admin";p.focus();document.getElementById("er").textContent="Isi password admin, lalu tekan Login."}}

/* ---------- KONFIRMASI TES ---------- */
function vConfirm(){reload();var ms=mapels(),m=E.m&&ms.indexOf(E.m)>=0?E.m:ms[0];E.m=m;
var r=S.res[key(E.s.nisn,m)],st=!r?"Tes Baru":r.status==="selesai"?"Tes Selesai":"Sedang Dikerjakan";
app.innerHTML=head(E.s.nisn+" - "+E.s.nama)+'<div class="card"><h1>Konfirmasi Tes</h1><label>Nama Tes</label><select class="fld" id="m">'+ms.map(function(x){return'<option'+(x===m?' selected':'')+'>'+e(x)+'</option>'}).join("")+'</select>'+
'<label>Status Tes</label><div class="fld">'+st+'</div><label>Waktu Tes</label><div class="fld" id="wk">'+fmtNow()+'</div><label>Alokasi Waktu Tes</label><div class="fld">'+(S.time[m]||30)+' Menit</div>'+
'<button class="btn full" id="mul"'+(r&&r.status==="selesai"?' disabled':'')+'>'+(r&&r.status==="mengerjakan"?"Lanjutkan":"Mulai")+'</button><p class="muted" style="text-align:center"><a href="#" id="out" style="color:var(--blue)">Keluar</a></p></div>';
document.getElementById("m").onchange=function(){E.m=this.value;vConfirm()};
document.getElementById("out").onclick=function(ev){ev.preventDefault();exitFullscreen();E.s=null;go("login")};
document.getElementById("mul").onclick=function(){
  enterFullscreen();
  var k=key(E.s.nisn,m);if(!qsOf(m).length)return alert("Soal untuk tes ini belum tersedia.");
  if(!S.res[k]){
    S.res[k]={status:"mengerjakan",start:Date.now(),ans:{},ragu:{}};
    save();
    pushToServer({action:"saveResult", nisn:E.s.nisn, nama:E.s.nama, mapel:m, status:"mengerjakan", start:S.res[k].start, ans:{}, ragu:{}});
  }
  E.i=0;E.fs=E.fs||18;go("exam");
}}

/* ---------- UJIAN ---------- */
var tm;
function vExam(){reload();clearInterval(tm);var m=E.m,qs=qsOf(m),k=key(E.s.nisn,m),r=S.res[k],q=qs[E.i],n=qs.length;
if(!r||r.status==="selesai")return go("confirm");
var h='<div class="ex"><div class="exh"><div><div class="n">Soal nomor <b>'+(E.i+1)+'</b></div><div class="fs muted">Ukuran font soal: <button data-f="15" style="font-size:12px">A</button><button data-f="18" style="font-size:15px">A</button><button data-f="22" style="font-size:19px">A</button></div></div>'+
'<div style="text-align:right"><div class="row" style="justify-content:flex-end"><span class="pill">Sisa Waktu : <b id="tm">--:--:--</b></span><button class="pill b" id="dl">Daftar Soal ▦</button></div><div class="muted" style="margin-top:6px">'+e(m)+'</div></div></div>'+
'<div class="body" style="font-size:'+E.fs+'px"><div>'+(q.stim?'<p>'+e(q.stim).replace(/\n/g,"<br>")+'</p>':'')+'<p>'+e(q.q).replace(/\n/g,"<br>")+'</p></div><div>'+
q.opts.map(function(o,i){return'<div class="opt'+(r.ans[q.id]===i?' on':'')+'" role="radio" tabindex="0" aria-checked="'+(r.ans[q.id]===i)+'" data-o="'+i+'"><span class="r"></span><span>'+e(o)+'</span></div>'}).join("")+'</div></div>'+
'<div class="foot"><button class="btn red" id="pv"'+(E.i===0?' style="visibility:hidden"':'')+'>‹ Soal sebelumnya</button><button class="btn yel" id="rg">'+(r.ragu[q.id]?'☑':'☐')+' Ragu-ragu</button>'+
(E.i<n-1?'<button class="btn next" id="nx">Soal berikutnya ›</button>':'<button class="btn green" id="fin">Selesai</button>')+'</div></div>';
app.innerHTML=h;
function upd(){
  save();
  pushToServer({action:"saveResult", nisn:E.s.nisn, nama:E.s.nama, mapel:m, status:"mengerjakan", start:r.start, ans:r.ans, ragu:r.ragu});
}
[].forEach.call(app.querySelectorAll("[data-f]"),function(b){b.onclick=function(){E.fs=+b.dataset.f;vExam()}});
[].forEach.call(app.querySelectorAll(".opt"),function(o){function pick(){r.ans[q.id]=+o.dataset.o;upd();vExam()}o.onclick=pick;o.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick()}}});
document.getElementById("rg").onclick=function(){r.ragu[q.id]=r.ragu[q.id]?0:1;upd();vExam()};
var pv=document.getElementById("pv");pv.onclick=function(){E.i--;vExam()};
var nx=document.getElementById("nx");if(nx)nx.onclick=function(){E.i++;vExam()};
var fin=document.getElementById("fin");if(fin)fin.onclick=function(){modalFinish()};
document.getElementById("dl").onclick=function(){modalList(qs,r)};
var end=r.start+(S.time[m]||30)*60000;
function tick(){var ms=end-Date.now();if(ms<=0){clearInterval(tm);return finish(true)}var s=Math.floor(ms/1000),t=document.getElementById("tm");if(t)t.textContent=pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)}
tick();tm=setInterval(tick,1000)}
function modalList(qs,r){var d=document.createElement("div");d.className="modal";
d.innerHTML='<div class="card"><h2>Daftar Soal</h2><p class="muted">Biru: sudah dijawab. Kuning: ragu-ragu.</p><div class="grid">'+qs.map(function(q,i){var c=r.ragu[q.id]?"q":r.ans[q.id]!=null?"a":"";return'<button class="g '+c+(i===E.i?' c':'')+'" data-i="'+i+'">'+(i+1)+'</button>'}).join("")+'</div><button class="btn gr full" id="cl">Tutup</button></div>';
document.body.appendChild(d);d.querySelector("#cl").onclick=function(){d.remove()};
[].forEach.call(d.querySelectorAll(".g"),function(b){b.onclick=function(){E.i=+b.dataset.i;d.remove();vExam()}})}
function modalFinish(){var d=document.createElement("div");d.className="modal";
d.innerHTML='<div class="card"><h1>Konfirmasi Tes</h1><p>Terimakasih telah berpartisipasi dalam tes ini. Silahkan tekan tombol <mark style="background:var(--red);color:#fff;padding:0 3px">SELESAI TES</mark> untuk mengakhiri tes. Atau tekan tombol <mark style="background:var(--green);color:#fff;padding:0 3px">KEMBALI</mark> untuk kembali ke halaman tes.</p><div class="row" style="margin-top:20px"><button class="btn red" id="ok" style="flex:1">SELESAI TES</button><button class="btn green" id="bk" style="flex:1">KEMBALI</button></div></div>';
document.body.appendChild(d);d.querySelector("#bk").onclick=function(){d.remove()};d.querySelector("#ok").onclick=function(){d.remove();finish(false)}}
async function finish(auto){
  clearInterval(tm);reload();var m=E.m,qs=qsOf(m),r=S.res[key(E.s.nisn,m)],c=0;
  qs.forEach(function(q){if(r.ans[q.id]===q.ans)c++});
  r.status="selesai";r.end=Date.now();r.score=Math.round(c/qs.length*100);save();
  await pushToServer({action:"saveResult", nisn:E.s.nisn, nama:E.s.nama, mapel:m, status:"selesai", start:r.start, end:r.end, score:r.score, ans:r.ans, ragu:r.ragu});
  var oldWarn = document.getElementById("fsWarnModal");
  if(oldWarn) oldWarn.remove();
  if(auto)alert("Waktu habis. Jawaban Anda tersimpan otomatis.");
  go("confirm");
}

/* ---------- ADMIN ---------- */
function vAdmin(){reload();var T=[["soal","Bank Soal"],["gen","Generate Soal AI"],["waktu","Waktu Ujian"],["peserta","Peserta"],["live","Hasil & Status Live"]];
app.innerHTML=head("Admin")+'<div class="wrap" style="padding-top:8px"><div class="tabs" style="margin-top:6px">'+T.map(function(t){return'<button data-t="'+t[0]+'" class="'+(E.tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join("")+'<button id="lo" style="margin-left:auto">Keluar</button></div><div class="panel" id="pn"></div></div>';
[].forEach.call(app.querySelectorAll("[data-t]"),function(b){b.onclick=function(){E.tab=b.dataset.t;vAdmin()}});
document.getElementById("lo").onclick=function(){E.adm=0;clearInterval(E.poll);go("login")};
clearInterval(E.poll);var pn=document.getElementById("pn");({soal:aSoal,gen:aGen,waktu:aWaktu,peserta:aPeserta,live:aLive})[E.tab](pn)}
function aSoal(p){var h='<div class="row"><h2 style="flex:1">Bank Soal ('+S.qs.length+')</h2><button class="btn sm" id="add">+ Tambah soal manual</button></div>';
mapels().forEach(function(m){h+='<h2 style="margin-top:18px">'+e(m)+' <span class="muted">('+qsOf(m).length+' soal)</span></h2>';qsOf(m).forEach(function(q,i){h+='<div class="q"><div><b>'+(i+1)+'.</b> '+e(q.q)+' <span class="tag t0">'+e(q.lv||"")+'</span></div><div class="muted">Kunci: '+"ABCDE"[q.ans]+'</div><div class="row" style="margin-top:6px"><button class="btn sm gr" data-e="'+q.id+'">Edit</button><button class="btn sm red" data-d="'+q.id+'">Hapus</button></div></div>'})});
p.innerHTML=h;document.getElementById("add").onclick=function(){editQ(null)};
[].forEach.call(p.querySelectorAll("[data-e]"),function(b){b.onclick=function(){editQ(+b.dataset.e)}});
[].forEach.call(p.querySelectorAll("[data-d]"),function(b){b.onclick=function(){if(confirm("Hapus soal ini?")){S.qs=S.qs.filter(function(q){return q.id!==+b.dataset.d});save();pushToServer({action:"syncSoal",qs:S.qs});vAdmin()}}})}
function editQ(id){var q=S.qs.filter(function(x){return x.id===id})[0]||{mapel:mapels()[0]||"Matematika",lv:"Sedang",stim:"",q:"",opts:["","","","",""],ans:0};
var d=document.createElement("div");d.className="modal";d.innerHTML='<div class="card" style="max-width:640px;max-height:90vh;overflow:auto"><h2>'+(id?"Edit soal":"Tambah soal")+'</h2><div class="f2"><div><label>Mata pelajaran</label><input class="fld" id="em" value="'+e(q.mapel)+'"></div><div><label>Level</label><select class="fld" id="el">'+["Mudah","Sedang","Sulit","HOTS"].map(function(x){return'<option'+(x===q.lv?' selected':'')+'>'+x+'</option>'}).join("")+'</select></div></div><label>Teks stimulus (opsional)</label><textarea class="fld" id="es">'+e(q.stim)+'</textarea><label>Pertanyaan</label><textarea class="fld" id="eq">'+e(q.q)+'</textarea>'+
q.opts.map(function(o,i){return'<label>Opsi '+"ABCDE"[i]+'</label><input class="fld" data-o="'+i+'" value="'+e(o)+'">'}).join("")+'<label>Kunci jawaban</label><select class="fld" id="ea">'+"ABCDE".split("").map(function(c,i){return'<option value="'+i+'"'+(i===q.ans?' selected':'')+'>'+c+'</option>'}).join("")+'</select><div class="row" style="margin-top:18px"><button class="btn" id="sv">Simpan</button><button class="btn gr" id="cx">Batal</button></div></div>';
document.body.appendChild(d);d.querySelector("#cx").onclick=function(){d.remove()};
d.querySelector("#sv").onclick=function(){var o={id:id||Date.now(),mapel:d.querySelector("#em").value.trim(),lv:d.querySelector("#el").value,stim:d.querySelector("#es").value,q:d.querySelector("#eq").value.trim(),opts:[].map.call(d.querySelectorAll("[data-o]"),function(i){return i.value}),ans:+d.querySelector("#ea").value};
if(!o.mapel||!o.q||o.opts.some(function(x){return!x.trim()}))return alert("Mata pelajaran, pertanyaan, dan semua opsi wajib diisi.");
if(id)S.qs=S.qs.map(function(x){return x.id===id?o:x});else S.qs.push(o);save();pushToServer({action:"syncSoal",qs:S.qs});d.remove();vAdmin()}}
function aGen(p){p.innerHTML='<h2>Generate soal dengan AI</h2><div class="f2"><div><label>Mata pelajaran</label><input class="fld" id="gm" value="Matematika"></div><div><label>Jumlah soal</label><input class="fld" id="gj" type="number" min="1" max="20" value="5"></div><div><label>Level soal</label><select class="fld" id="gl"><option>Mudah</option><option selected>Sedang</option><option>Sulit</option><option>HOTS</option></select></div></div><label>Tujuan Pembelajaran (TP)</label><textarea class="fld" id="gt" placeholder="Contoh: Peserta didik dapat menghitung keliling dan luas bangun datar"></textarea><button class="btn" id="gg" style="margin-top:16px">Generate soal</button><div class="err" id="gr"></div><div id="gp"></div>';
document.getElementById("gg").onclick=async function(){var gr=document.getElementById("gr"),m=gm.value.trim(),t=gt.value.trim(),j=Math.min(20,+gj.value||5);if(!m||!t){gr.textContent="Isi mata pelajaran dan TP terlebih dahulu.";return}
gr.style.color="var(--mu)";gr.textContent="AI sedang membuat soal…";this.disabled=true;var btn=this;
try{var sm=await claude.use("sample");if(!sm)throw{code:"na"};
var out=await sm.json("Buat "+j+" soal pilihan ganda mata pelajaran "+m+" untuk siswa, berdasarkan Tujuan Pembelajaran: "+t+". Level: "+gl.value+". Tiap soal punya tepat 5 opsi dan satu jawaban benar. Gunakan Bahasa Indonesia. Balas HANYA array JSON: [{\"stim\":\"teks stimulus atau string kosong\",\"q\":\"pertanyaan\",\"opts\":[\"a\",\"b\",\"c\",\"d\",\"e\"],\"ans\":0}] dengan ans = indeks 0-4 jawaban benar.",{cache:false});
var arr=(Array.isArray(out)?out:[]).filter(function(x){return x&&x.q&&x.opts&&x.opts.length===5}).map(function(x,i){return{id:Date.now()+i,mapel:m,lv:gl.value,stim:x.stim||"",q:x.q,opts:x.opts,ans:+x.ans||0}});
if(!arr.length)throw{code:"empty"};E.gen=arr;gr.textContent="";
var gp=document.getElementById("gp");gp.innerHTML='<h2 style="margin-top:18px">Hasil ('+arr.length+' soal)</h2>'+arr.map(function(q,i){return'<div class="q"><b>'+(i+1)+'.</b> '+e(q.stim?q.stim+" ":"")+e(q.q)+'<div class="muted">'+q.opts.map(function(o,k){return"ABCDE"[k]+". "+e(o)}).join(" &nbsp; ")+'<br>Kunci: '+"ABCDE"[q.ans]+'</div></div>'}).join("")+'<button class="btn green" id="gs" style="margin-top:14px">Simpan semua ke bank soal</button>';
document.getElementById("gs").onclick=function(){S.qs=S.qs.concat(E.gen);save();pushToServer({action:"syncSoal",qs:S.qs});E.tab="soal";vAdmin()}}
catch(x){gr.style.color="var(--red)";gr.textContent=x&&x.code==="not_granted"?"Izin AI ditolak. Izinkan saat diminta, lalu coba lagi.":x&&x.code==="na"?"Fitur AI hanya tersedia bila halaman dibuka lewat claude.ai. Gunakan Tambah soal manual.":"Soal gagal dibuat. Coba lagi atau ubah TP.";}
btn.disabled=false}}
function aWaktu(p){var h='<h2>Pengaturan waktu ujian</h2><p class="muted">Alokasi waktu per tes (menit). Siswa melihat angka ini di halaman konfirmasi.</p>';
mapels().forEach(function(m){h+='<label>'+e(m)+'</label><input class="fld" type="number" min="1" data-m="'+e(m)+'" value="'+(S.time[m]||30)+'" style="max-width:160px">'});
h+='<h2 style="margin-top:26px">Password siswa (NPSN sekolah)</h2><input class="fld" id="np" value="'+e(S.npsn)+'" style="max-width:260px"><br><button class="btn" id="sv" style="margin-top:18px">Simpan pengaturan</button> <span class="muted" id="ok"></span>';
p.innerHTML=h;document.getElementById("sv").onclick=function(){[].forEach.call(p.querySelectorAll("[data-m]"),function(i){S.time[i.dataset.m]=Math.max(1,+i.value||30)});S.npsn=document.getElementById("np").value.trim()||S.npsn;save();pushToServer({action:"syncPengaturan",npsn:S.npsn,time:S.time});document.getElementById("ok").textContent="Tersimpan ke Google Sheets."}}
function aPeserta(p){p.innerHTML='<h2>Peserta ujian ('+S.students.length+')</h2><div class="f2"><div><label>Nama</label><input class="fld" id="nm"></div><div><label>NISN</label><input class="fld" id="ns" inputmode="numeric"></div></div><div class="row" style="margin-top:14px"><button class="btn sm" id="ad">Tambah peserta</button><label class="btn sm gr" style="margin:0;cursor:pointer">Upload daftar (.csv / .txt)<input type="file" id="up" accept=".csv,.txt,.tsv" hidden></label></div><p class="muted">Format file: satu peserta per baris, <b>NISN,Nama</b> (pemisah koma, titik koma, atau tab). Baris judul dilewati otomatis.</p><div class="err" id="pe"></div><div class="tw"><table><tr><th>NISN</th><th>Nama</th><th></th></tr>'+S.students.map(function(s){return'<tr><td>'+e(s.nisn)+'</td><td>'+e(s.nama)+'</td><td><button class="btn sm red" data-x="'+e(s.nisn)+'">Hapus</button></td></tr>'}).join("")+'</table></div>';
document.getElementById("ad").onclick=function(){var n=ns.value.trim(),m=nm.value.trim();if(!/^\d+$/.test(n)||!m)return pe.textContent="Isi nama dan NISN (angka saja).";if(S.students.some(function(s){return s.nisn===n}))return pe.textContent="NISN sudah terdaftar.";S.students.push({nisn:n,nama:m});save();pushToServer({action:"syncPeserta",students:S.students});vAdmin()};
document.getElementById("up").onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var c=0;String(rd.result).split(/\r?\n/).forEach(function(l){var a=l.split(/[,;\t]/);var n=(a[0]||"").trim().replace(/^"|"$/g,""),m=(a[1]||"").trim().replace(/^"|"$/g,"");if(/^\d+$/.test(n)&&m&&!S.students.some(function(s){return s.nisn===n})){S.students.push({nisn:n,nama:m});c++}});save();pushToServer({action:"syncPeserta",students:S.students});vAdmin();setTimeout(function(){var x=document.getElementById("pe");if(x){x.style.color="var(--green)";x.textContent=c+" peserta berhasil ditambahkan."}},0)};rd.readAsText(f)};
[].forEach.call(p.querySelectorAll("[data-x]"),function(b){b.onclick=function(){if(confirm("Hapus peserta ini?")){S.students=S.students.filter(function(s){return s.nisn!==b.dataset.x});save();pushToServer({action:"syncPeserta",students:S.students});vAdmin()}}})}
function aLive(p){async function draw(){await pullFromServer(true);reload();var ms=mapels(),cnt={0:0,1:0,2:0},rows="";
S.students.forEach(function(s){var cells="",st=0,done=0;ms.forEach(function(m){var r=S.res[key(s.nisn,m)],n=qsOf(m).length;
if(r&&r.status==="selesai"){done++;cells+=e(m)+': <span class="tag t2">Selesai</span> nilai '+r.score+'<br>'}
else if(r){st=1;cells+=e(m)+': <span class="tag t1">Mengerjakan</span> '+Object.keys(r.ans).length+'/'+n+' terjawab<br>'}});
var lg=S.lg[s.nisn];var tag=st?1:(done&&done===ms.length)?2:lg?3:0;if(!st&&done&&done<ms.length)tag=3;
var lab=["Belum login","Sedang mengerjakan","Selesai","Sudah login"][tag];cnt[tag]=(cnt[tag]||0)+1;
rows+='<tr><td>'+e(s.nisn)+'</td><td>'+e(s.nama)+'</td><td><span class="tag t'+tag+'">'+lab+'</span></td><td>'+(cells||'<span class="muted">–</span>')+'</td></tr>'});
var tot=S.students.length;p.innerHTML='<div class="row"><h2 style="flex:1">Status Live</h2><button class="btn sm gr" id="rs">Reset lokal</button></div><div class="row" style="margin:10px 0"><span class="tag t0">Belum login: '+(cnt[0]||0)+'</span><span class="tag t1">Mengerjakan: '+(cnt[1]||0)+'</span><span class="tag t2">Selesai: '+(cnt[2]||0)+'</span><span class="tag t3">Sudah login: '+(cnt[3]||0)+'</span><span class="muted">dari '+tot+' peserta · sinkron otomatis dengan Google Sheets</span></div><div class="tw"><table><tr><th>NISN</th><th>Nama</th><th>Status</th><th>Detail per tes</th></tr>'+rows+'</table></div>';
document.getElementById("rs").onclick=function(){if(confirm("Hapus cache hasil di browser ini?")){S.res={};S.lg={};save();draw()}}}
draw();E.poll=setInterval(function(){if(E.v==="admin"&&E.tab==="live")draw()},5000)}

function render(){clearInterval(E.poll);if(E.v!=="exam")clearInterval(tm);
({login:vLogin,confirm:vConfirm,exam:vExam,admin:vAdmin})[E.v||"login"]()}

E.v="login";
render();
pullFromServer(false).then(function(){ render(); });
})();
</script>
</body>
</html>
